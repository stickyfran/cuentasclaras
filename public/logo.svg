<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
  </defs>
  <!-- Background Board -->
  <rect x="10" y="10" width="80" height="80" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="4" />
  <!-- Grid Lines / Abacus Wires -->
  <line x1="30" y1="20" x2="30" y2="80" stroke="#334155" stroke-width="2" stroke-dasharray="2 2" />
  <line x1="50" y1="20" x2="50" y2="80" stroke="#334155" stroke-width="2" stroke-dasharray="2 2" />
  <line x1="70" y1="20" x2="70" y2="80" stroke="#334155" stroke-width="2" stroke-dasharray="2 2" />
  <!-- Yupana Counters (Beads) -->
  <circle cx="30" cy="35" r="7" fill="url(#grad)" />
  <circle cx="30" cy="55" r="7" fill="url(#grad)" />
  <circle cx="50" cy="45" r="7" fill="url(#grad)" />
  <circle cx="50" cy="65" r="7" fill="url(#grad)" />
  <circle cx="70" cy="25" r="7" fill="url(#grad)" />
  <circle cx="70" cy="55" r="7" fill="#e2e8f0" />
</svg>
